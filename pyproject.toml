[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-flipdot"
version = "0.1.0b1"
authors = [
  { name="domints", email="dominik@szymanski.io" },
]
description = "A simple Python package for driving Pixel Bydgoszcz flip-dot displays"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [ "LICENSE" ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "pyserial==3.5",
  "pillow>=10.4.0"
]
[project.optional-dependencies]
# numpy is only needed for the legacy (deprecated) numpy-array rendering path;
# pillow moved to core deps because pixel.renderer builds frames from PIL images.
images = ["numpy==2.1.3", "pillow>=10.4.0"]
gpio = ["gpiozero==2.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.urls]
Homepage = "https://github.com/domints/PixelFlipDot"
Issues = "https://github.com/domints/PixelFlipDot/issues"
